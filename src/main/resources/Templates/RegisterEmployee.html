<!DOCTYPE html>
<html class="light" lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация на потребител - Логистика Експрес</title>

  <!-- Външни ресурси -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700&display=swap" rel="stylesheet">

  <!-- Tailwind конфигурация -->
  <script id="tailwind-config">
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    "primary": "#135bec",
                    "background-light": "#f6f6f8",
                    "background-dark": "#101622",
                },
                fontFamily: {
                    "display": ["Manrope", "sans-serif"]
                },
                borderRadius: {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
                },
            },
        },
    }
  </script>

  <style>
    .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body {
        background-image: radial-gradient(circle at 2px 2px, rgba(19, 91, 236, 0.05) 1px, transparent 0);
        background-size: 32px 32px;
    }
    .dark body {
        background-image: radial-gradient(circle at 2px 2px, rgba(19, 91, 236, 0.08) 1px, transparent 0);
    }
  </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#111318] dark:text-white min-h-screen flex flex-col">
<div class="relative flex flex-col w-full min-h-screen items-center justify-center px-4 py-8 lg:py-12">

  <!-- Лого -->
  <div class="flex items-center gap-3 text-primary mb-8">
    <div class="size-10">
      <svg fill="currentColor" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M44 4H30.6666V17.3334H17.3334V30.6666H4V44H44V4Z"></path>
      </svg>
    </div>
    <h1 class="text-[#111318] dark:text-white text-2xl font-black leading-tight tracking-tight">Логистика Експрес</h1>
  </div>

  <!-- Форма за регистрация -->
  <div class="w-full max-w-[480px] bg-white dark:bg-[#1a2130] rounded-2xl shadow-xl shadow-primary/5 border border-[#dbdfe6] dark:border-gray-700 overflow-hidden">
    <div class="p-6 lg:p-8">
      <!-- Заглавие -->
      <div class="mb-8">
        <h2 class="text-2xl font-bold text-[#111318] dark:text-white mb-2">Създайте акаунт</h2>
        <p class="text-[#616f89] dark:text-gray-400 text-sm">Попълнете данните си, за да започнете да управлявате своите пратки.</p>
      </div>

      <!-- Форма -->
      <form class="space-y-5" id="registration-form">
        <!-- Тип потребител -->
        <fieldset class="space-y-3">
          <legend class="text-sm font-semibold text-[#111318] dark:text-gray-200 mb-2">Тип потребител</legend>
          <div class="grid grid-cols-2 gap-3" role="radiogroup" aria-label="Изберете тип потребител">
            <label class="relative flex items-center justify-center p-3 border-2 border-primary bg-primary/5 rounded-xl cursor-pointer transition-all has-[:checked]:border-primary has-[:checked]:bg-primary/10">
              <input class="hidden" name="user_type" type="radio" value="client" checked aria-checked="true" role="radio">
              <span class="flex items-center gap-2 text-primary font-bold text-sm">
                                    <span class="material-symbols-outlined text-[20px]">person</span>
                                    Клиент
                                </span>
            </label>
            <label class="relative flex items-center justify-center p-3 border-2 border-[#dbdfe6] dark:border-gray-700 rounded-xl cursor-pointer hover:border-primary/50 transition-all has-[:checked]:border-primary has-[:checked]:bg-primary/10">
              <input class="hidden" name="user_type" type="radio" value="employee" aria-checked="false" role="radio">
              <span class="flex items-center gap-2 text-[#616f89] dark:text-gray-400 font-bold text-sm">
                                    <span class="material-symbols-outlined text-[20px]">badge</span>
                                    Служител
                                </span>
            </label>
          </div>
        </fieldset>

        <!-- Пълно име -->
        <div class="space-y-2">
          <label for="full_name" class="text-sm font-semibold text-[#111318] dark:text-gray-200">Имена</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-[#616f89] text-[20px]" aria-hidden="true">person_outline</span>
            <input id="full_name" class="w-full pl-11 pr-4 py-3 bg-[#f0f2f4] dark:bg-gray-800 border-none rounded-xl focus:ring-2 focus:ring-primary text-[#111318] dark:text-white placeholder:text-[#616f89]" placeholder="Иван Иванов" type="text" required>
          </div>
        </div>

        <!-- Имейл -->
        <div class="space-y-2">
          <label for="email" class="text-sm font-semibold text-[#111318] dark:text-gray-200">Имейл адрес</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-[#616f89] text-[20px]" aria-hidden="true">mail</span>
            <input id="email" class="w-full pl-11 pr-4 py-3 bg-[#f0f2f4] dark:bg-gray-800 border-none rounded-xl focus:ring-2 focus:ring-primary text-[#111318] dark:text-white placeholder:text-[#616f89]" placeholder="example@logistics.bg" type="email" required>
          </div>
        </div>

        <!-- Парола -->
        <div class="space-y-2">
          <label for="password" class="text-sm font-semibold text-[#111318] dark:text-gray-200">Парола</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-[#616f89] text-[20px]" aria-hidden="true">lock_open</span>
            <input id="password" class="w-full pl-11 pr-4 py-3 bg-[#f0f2f4] dark:bg-gray-800 border-none rounded-xl focus:ring-2 focus:ring-primary text-[#111318] dark:text-white placeholder:text-[#616f89]" placeholder="••••••••" type="password" required minlength="8">
          </div>
        </div>

        <!-- Потвърждение на парола -->
        <div class="space-y-2">
          <label for="password_confirm" class="text-sm font-semibold text-[#111318] dark:text-gray-200">Потвърдете паролата</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-[#616f89] text-[20px]" aria-hidden="true">lock</span>
            <input id="password_confirm" class="w-full pl-11 pr-4 py-3 bg-[#f0f2f4] dark:bg-gray-800 border-none rounded-xl focus:ring-2 focus:ring-primary text-[#111318] dark:text-white placeholder:text-[#616f89]" placeholder="••••••••" type="password" required minlength="8">
          </div>
        </div>

        <!-- Бутон за регистрация -->
        <button class="w-full py-4 bg-primary text-white rounded-xl font-bold text-lg hover:bg-blue-700 transition-all shadow-lg shadow-primary/30 mt-4 active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" type="submit">
          Регистрация
        </button>
      </form>

      <!-- Вход за вече регистрирани потребители -->
      <div class="mt-8 pt-6 border-t border-[#dbdfe6] dark:border-gray-700 text-center">
        <p class="text-[#616f89] dark:text-gray-400 text-sm">
          Вече имате акаунт?
          <a class="text-primary font-bold hover:underline ml-1 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 rounded" href="#" aria-label="Влезте в профила си">Влезте тук</a>
        </p>
      </div>
    </div>
  </div>

  <!-- Футър -->
  <footer class="mt-8 lg:mt-12 text-center text-[#616f89] dark:text-gray-500 text-xs max-w-[480px]">
    <div class="flex flex-wrap justify-center gap-x-6 gap-y-2 mb-4">
      <a class="hover:text-primary transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 rounded" href="#">Помощ</a>
      <a class="hover:text-primary transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 rounded" href="#">Общи условия</a>
      <a class="hover:text-primary transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 rounded" href="#">Поверителност</a>
    </div>
    <p>© 2024 Логистика Експрес. Всички права запазени.</p>
  </footer>
</div>
</body>
</html>
