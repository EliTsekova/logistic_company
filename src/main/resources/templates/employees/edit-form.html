<!DOCTYPE html>
<html lang="bg"
      xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">

  <title>Редакция на служител</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>

  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
        rel="stylesheet">

  <style>
    body {
        font-family: 'Manrope', sans-serif;
    }
  </style>
</head>

<body class="bg-[#f6f6f8] text-[#111318]">

<div class="max-w-4xl mx-auto p-8">

  <!-- HEADER -->
  <div class="mb-8">

    <h1 class="text-3xl font-bold">
      Редакция на служител
    </h1>

    <p class="text-[#616f89] mt-1">
      Редакция на информацията за служителя.
    </p>
  </div>

  <!-- FORM -->
  <form th:action="@{/employees/update/{id}(id=${employeeForm.id})}"
        th:object="${employeeForm}"
        method="post"
        class="bg-white rounded-2xl border border-[#dbdfe6] shadow-sm p-8 space-y-6">

    <!-- ERRORS -->
    <div th:if="${#fields.hasErrors('*')}"
         class="bg-red-100 text-red-700 px-4 py-3 rounded-xl">

      <p class="font-semibold mb-2">
        Има грешки във формата:
      </p>

      <ul class="list-disc list-inside text-sm">
        <li th:each="err : ${#fields.errors('*')}"
            th:text="${err}">
        </li>
      </ul>
    </div>

    <input type="hidden" th:field="*{id}">
    <input type="hidden" th:field="*{userId}">

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

      <!-- FIRST NAME -->
      <div>

        <label class="block text-sm font-semibold mb-2">
          Име
        </label>

        <input type="text"
               th:field="*{firstName}"
               class="w-full rounded-xl border-gray-300"
               required>
      </div>

      <!-- LAST NAME -->
      <div>

        <label class="block text-sm font-semibold mb-2">
          Фамилия
        </label>

        <input type="text"
               th:field="*{lastName}"
               class="w-full rounded-xl border-gray-300"
               required>
      </div>

      <!-- USERNAME -->
      <div>

        <label class="block text-sm font-semibold mb-2">
          Username
        </label>

        <input type="text"
               th:field="*{username}"
               class="w-full rounded-xl border-gray-300"
               required>
      </div>

      <!-- EMAIL -->
      <div>

        <label class="block text-sm font-semibold mb-2">
          Email
        </label>

        <input type="email"
               th:field="*{email}"
               class="w-full rounded-xl border-gray-300"
               required>
      </div>

      <!-- PASSWORD -->
      <div class="md:col-span-2">

        <label class="block text-sm font-semibold mb-2">
          Нова парола
        </label>

        <input type="password"
               th:field="*{password}"
               class="w-full rounded-xl border-gray-300">

        <p class="text-xs text-gray-500 mt-1">
          Остави празно ако не искаш смяна на паролата.
        </p>
      </div>

      <!-- POSITION -->
      <div>

        <label class="block text-sm font-semibold mb-2">
          Позиция
        </label>

        <select th:field="*{positionType}"
                class="w-full rounded-xl border-gray-300"
                required>

          <option value="">
            Избери позиция
          </option>

          <option th:each="position : ${positionTypes}"
                  th:value="${position}"
                  th:text="${position}">
          </option>
        </select>
      </div>

      <!-- OFFICE -->
      <div>

        <label class="block text-sm font-semibold mb-2">
          Офис
        </label>

        <select th:field="*{officeId}"
                class="w-full rounded-xl border-gray-300"
                required>

          <option value="">
            Избери офис
          </option>

          <option th:each="office : ${offices}"
                  th:value="${office.id}"
                  th:text="${office.title}">
          </option>
        </select>
      </div>
    </div>

    <!-- BUTTONS -->
    <div class="flex justify-end gap-3 pt-6 border-t border-[#dbdfe6]">

      <button type="button"
              onclick="history.back()"
              class="px-5 py-3 rounded-xl bg-gray-100 hover:bg-gray-200 font-semibold">
        Назад
      </button>

      <button type="submit"
              class="px-5 py-3 rounded-xl bg-[#135bec] hover:bg-blue-700 text-white font-semibold">

        Запази промените
      </button>
    </div>
  </form>
</div>

</body>
</html>
