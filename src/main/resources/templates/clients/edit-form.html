<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редакция на клиент</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Manrope', sans-serif;
        }
    </style>
</head>

<body class="bg-[#f6f6f8] text-[#111318]">

<div class="max-w-3xl mx-auto p-8">

    <div class="mb-8">
        <h1 class="text-3xl font-bold">
            Редакция на клиент
        </h1>

        <p class="text-[#616f89] mt-1">
            Промяна на информацията за клиента
        </p>
    </div>

    <form th:action="@{/clients/update/{id}(id=${clientForm.id})}"
          th:object="${clientForm}"
          method="post"
          class="bg-white rounded-2xl border border-[#dbdfe6] shadow-sm p-8 space-y-6">

        <input type="hidden" th:field="*{id}">
        <input type="hidden" th:field="*{userId}">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

            <div>
                <label class="block text-sm font-semibold mb-2">
                    Име
                </label>

                <input type="text"
                       th:field="*{firstName}"
                       class="w-full rounded-xl border-gray-300"
                       required>
            </div>

            <div>
                <label class="block text-sm font-semibold mb-2">
                    Фамилия
                </label>

                <input type="text"
                       th:field="*{lastName}"
                       class="w-full rounded-xl border-gray-300"
                       required>
            </div>

            <div>
                <label class="block text-sm font-semibold mb-2">
                    Username
                </label>

                <input type="text"
                       th:field="*{username}"
                       class="w-full rounded-xl border-gray-300"
                       required>
            </div>

            <div>
                <label class="block text-sm font-semibold mb-2">
                    Email
                </label>

                <input type="email"
                       th:field="*{email}"
                       class="w-full rounded-xl border-gray-300"
                       required>
            </div>

            <div class="md:col-span-2">
                <label class="block text-sm font-semibold mb-2">
                    Телефон
                </label>

                <input type="text"
                       th:field="*{phoneNumber}"
                       class="w-full rounded-xl border-gray-300"
                       required>
            </div>
        </div>

        <div class="flex justify-end gap-3 pt-6 border-t border-[#dbdfe6]">

            <a href="/clients"
               class="px-5 py-3 rounded-xl bg-gray-100 hover:bg-gray-200 font-semibold">

                Назад
            </a>

            <button type="submit"
                    class="px-5 py-3 rounded-xl bg-[#135bec] hover:bg-blue-700 text-white font-semibold">

                Запази промените
            </button>
        </div>
    </form>
</div>

</body>
</html>
