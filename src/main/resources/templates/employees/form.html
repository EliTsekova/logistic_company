<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Нов служител</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>

  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
        rel="stylesheet">

  <style>
    body {
        font-family: 'Manrope', sans-serif;
    }
  </style>
</head>

<body class="bg-[#f6f6f8] text-[#111318]">

<div class="max-w-3xl mx-auto p-8">

  <!-- HEADER -->
  <div class="mb-8">
    <h1 class="text-3xl font-bold">
      Нов служител
    </h1>

    <p class="text-[#616f89] mt-1">
      Създаване на потребител и профил на служител.
    </p>
  </div>

  <!-- FORM -->
  <form th:action="@{/employees}"
        th:object="${employeeForm}"
        method="post"
        class="bg-white rounded-2xl border border-[#dbdfe6] shadow-sm p-8 space-y-6">

    <!-- GLOBAL ERRORS -->
    <div th:if="${#fields.hasAnyErrors()}"
         class="bg-red-100 text-red-700 px-4 py-3 rounded-xl">

      <p class="font-semibold mb-2">
        Има грешки във формата:
      </p>

      <ul class="list-disc pl-5">
        <li th:each="err : ${#fields.allErrors()}"
            th:text="${err}">
        </li>
      </ul>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

      <!-- FIRST NAME -->
      <div>

        <label class="block text-sm font-semibold mb-2">
          Име
        </label>

        <input type="text"
               th:field="*{firstName}"
               class="w-full rounded-xl border-gray-300"
               required>

        <p th:if="${#fields.hasErrors('firstName')}"
           th:errors="*{firstName}"
           class="text-red-600 text-sm mt-1"></p>
      </div>

      <!-- LAST NAME -->
      <div>

        <label class="block text-sm font-semibold mb-2">
          Фамилия
        </label>

        <input type="text"
               th:field="*{lastName}"
               class="w-full rounded-xl border-gray-300"
               required>

        <p th:if="${#fields.hasErrors('lastName')}"
           th:errors="*{lastName}"
           class="text-red-600 text-sm mt-1"></p>
      </div>

      <!-- USERNAME -->
      <div>

        <label class="block text-sm font-semibold mb-2">
          Потребителско име
        </label>

        <input type="text"
               th:field="*{username}"
               class="w-full rounded-xl border-gray-300"
               required>

        <p th:if="${#fields.hasErrors('username')}"
           th:errors="*{username}"
           class="text-red-600 text-sm mt-1"></p>
      </div>

      <!-- EMAIL -->
      <div>

        <label class="block text-sm font-semibold mb-2">
          Email
        </label>

        <input type="email"
               th:field="*{email}"
               class="w-full rounded-xl border-gray-300"
               required>

        <p th:if="${#fields.hasErrors('email')}"
           th:errors="*{email}"
           class="text-red-600 text-sm mt-1"></p>
      </div>

      <!-- PASSWORD -->
      <div>

        <label class="block text-sm font-semibold mb-2">
          Парола
        </label>

        <input type="password"
               th:field="*{password}"
               class="w-full rounded-xl border-gray-300"
               required>

        <p th:if="${#fields.hasErrors('password')}"
           th:errors="*{password}"
           class="text-red-600 text-sm mt-1"></p>
      </div>

      <!-- CONFIRM PASSWORD -->
      <div>

        <label class="block text-sm font-semibold mb-2">
          Повтори парола
        </label>

        <input type="password"
               th:field="*{confirmPassword}"
               class="w-full rounded-xl border-gray-300"
               required>

        <p th:if="${#fields.hasErrors('confirmPassword')}"
           th:errors="*{confirmPassword}"
           class="text-red-600 text-sm mt-1"></p>
      </div>

      <!-- POSITION -->
      <div>

        <label class="block text-sm font-semibold mb-2">
          Позиция
        </label>

        <select th:field="*{positionType}"
                class="w-full rounded-xl border-gray-300"
                required>

          <option value="">
            Избери позиция
          </option>

          <option th:each="position : ${positionTypes}"
                  th:value="${position}"
                  th:text="${position}">
          </option>
        </select>

        <p th:if="${#fields.hasErrors('positionType')}"
           th:errors="*{positionType}"
           class="text-red-600 text-sm mt-1"></p>
      </div>

      <!-- OFFICE -->
      <div>

        <label class="block text-sm font-semibold mb-2">
          Офис
        </label>

        <select th:field="*{officeId}"
                class="w-full rounded-xl border-gray-300"
                required>

          <option value="">
            Избери офис
          </option>

          <option th:each="office : ${offices}"
                  th:value="${office.id}"
                  th:text="${office.title}">
          </option>
        </select>

        <p th:if="${#fields.hasErrors('officeId')}"
           th:errors="*{officeId}"
           class="text-red-600 text-sm mt-1"></p>
      </div>
    </div>

    <!-- BUTTONS -->
    <div class="flex justify-end gap-3 pt-6 border-t border-[#dbdfe6]">

      <a href="/employees"
         class="px-5 py-3 rounded-xl bg-gray-100 hover:bg-gray-200 font-semibold">

        Назад
      </a>

      <button type="submit"
              class="px-5 py-3 rounded-xl bg-[#135bec] hover:bg-blue-700 text-white font-semibold">

        Запази служител
      </button>
    </div>
  </form>
</div>

</body>
</html>
