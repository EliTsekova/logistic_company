<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Редакция на компания</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>

  <script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    primary: "#135bec"
                }
            }
        }
    }
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
        rel="stylesheet">

  <style>
    body {
        font-family: 'Manrope', sans-serif;
    }
  </style>
</head>

<body class="bg-[#f6f6f8] text-[#111318]">

<div class="max-w-4xl mx-auto p-8">

  <!-- HEADER -->
  <div class="flex items-center justify-between mb-8">

    <div>
      <h1 class="text-3xl font-bold">
        Редакция на компания
      </h1>

      <p class="text-[#616f89] mt-1">
        Промяна на информацията за компанията
      </p>
    </div>

    <a href="/company"
       class="px-5 py-3 rounded-xl bg-gray-100 hover:bg-gray-200 font-semibold">
      Назад
    </a>
  </div>

  <!-- FORM -->
  <div class="bg-white rounded-2xl border border-[#dbdfe6] shadow-sm p-8">

    <form th:action="@{/company/edit}"
          th:object="${company}"
          method="post"
          class="space-y-6">

      <div>
        <label class="block mb-2 font-semibold">
          Име на компания
        </label>

        <input type="text"
               th:field="*{name}"
               class="w-full rounded-xl border-gray-300"
               required>
      </div>

      <div>
        <label class="block mb-2 font-semibold">
          Булстат
        </label>

        <input type="text"
               th:field="*{uic}"
               class="w-full rounded-xl border-gray-300"
               required>
      </div>

      <div>
        <label class="block mb-2 font-semibold">
          Телефон
        </label>

        <input type="text"
               th:field="*{phone}"
               class="w-full rounded-xl border-gray-300">
      </div>

      <div>
        <label class="block mb-2 font-semibold">
          Имейл
        </label>

        <input type="email"
               th:field="*{email}"
               class="w-full rounded-xl border-gray-300">
      </div>

      <div>
        <label class="block mb-2 font-semibold">
          Адрес
        </label>

        <textarea th:field="*{address}"
                  rows="3"
                  class="w-full rounded-xl border-gray-300"></textarea>
      </div>

      <!-- BUTTONS -->
      <div class="flex justify-end gap-3 pt-6 border-t border-[#dbdfe6]">

        <a href="/company"
           class="px-5 py-3 rounded-xl bg-gray-100 hover:bg-gray-200 font-semibold">
          Отказ
        </a>

        <button type="submit"
                class="px-5 py-3 rounded-xl bg-primary text-white hover:bg-blue-700 font-semibold transition">
          Запази
        </button>
      </div>

    </form>
  </div>
</div>

</body>
</html>
