<!DOCTYPE html>
<html class="light" lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация - Логистика Експрес</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#135bec",
            "background-light": "#f6f6f8",
            "background-dark": "#101622"
          },
          fontFamily: {
            display: ["Manrope", "sans-serif"]
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Manrope', sans-serif;
      background-image: radial-gradient(circle at 2px 2px, rgba(19, 91, 236, 0.05) 1px, transparent 0);
      background-size: 32px 32px;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>

<body class="bg-background-light text-[#111318] min-h-screen flex flex-col">

<div class="relative flex flex-col w-full min-h-screen items-center justify-center px-4 py-8 lg:py-12">

  <div class="flex items-center gap-3 text-primary mb-8">
    <div class="size-10">
      <svg fill="currentColor" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <path d="M44 4H30.6666V17.3334H17.3334V30.6666H4V44H44V4Z"></path>
      </svg>
    </div>
    <h1 class="text-[#111318] text-2xl font-black leading-tight tracking-tight">
      Логистика Експрес
    </h1>
  </div>

  <div class="w-full max-w-[480px] bg-white rounded-2xl shadow-xl shadow-primary/5 border border-[#dbdfe6] overflow-hidden">
    <div class="p-6 lg:p-8">

      <div class="mb-8">
        <h2 class="text-2xl font-bold text-[#111318] mb-2">Създайте акаунт</h2>
        <p class="text-[#616f89] text-sm">
          Регистрация на клиент в системата.
        </p>
      </div>

      <div th:if="${error}" class="mb-5 rounded-xl border border-red-200 bg-red-50 text-red-700 px-4 py-3 text-sm">
        <span th:text="${error}"></span>
      </div>

      <form class="space-y-5"
            id="registration-form"
            th:action="@{/register}"
            th:object="${clientForm}"
            method="post">

        <div th:if="${#fields.hasErrors('*')}"
             class="rounded-xl border border-red-200 bg-red-50 text-red-700 px-4 py-3 text-sm">
          <p class="font-semibold mb-2">Има грешки във формата:</p>
          <ul class="list-disc list-inside">
            <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
          </ul>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div class="space-y-2">
            <label class="text-sm font-semibold">Име</label>
            <div class="relative">
              <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-[#616f89] text-[20px]">person_outline</span>
              <input th:field="*{firstName}" class="w-full pl-11 pr-4 py-3 bg-[#f0f2f4] border-none rounded-xl focus:ring-2 focus:ring-primary" placeholder="Иван" type="text" required>
            </div>
          </div>

          <div class="space-y-2">
            <label class="text-sm font-semibold">Фамилия</label>
            <div class="relative">
              <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-[#616f89] text-[20px]">person_outline</span>
              <input th:field="*{lastName}" class="w-full pl-11 pr-4 py-3 bg-[#f0f2f4] border-none rounded-xl focus:ring-2 focus:ring-primary" placeholder="Иванов" type="text" required>
            </div>
          </div>
        </div>

        <div class="space-y-2">
          <label class="text-sm font-semibold">Потребителско име</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-[#616f89] text-[20px]">alternate_email</span>
            <input th:field="*{username}" class="w-full pl-11 pr-4 py-3 bg-[#f0f2f4] border-none rounded-xl focus:ring-2 focus:ring-primary" placeholder="ivan.ivanov" type="text" required>
          </div>
        </div>

        <div class="space-y-2">
          <label class="text-sm font-semibold">Имейл адрес</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-[#616f89] text-[20px]">mail</span>
            <input th:field="*{email}" class="w-full pl-11 pr-4 py-3 bg-[#f0f2f4] border-none rounded-xl focus:ring-2 focus:ring-primary" placeholder="example@logistics.bg" type="email" required>
          </div>
        </div>

        <div class="space-y-2">
          <label class="text-sm font-semibold">Телефон</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-[#616f89] text-[20px]">call</span>
            <input th:field="*{phoneNumber}" class="w-full pl-11 pr-4 py-3 bg-[#f0f2f4] border-none rounded-xl focus:ring-2 focus:ring-primary" placeholder="0888123456" type="text" required>
          </div>
        </div>

        <div class="space-y-2">
          <label class="text-sm font-semibold">Парола</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-[#616f89] text-[20px]">lock_open</span>
            <input th:field="*{password}" class="w-full pl-11 pr-4 py-3 bg-[#f0f2f4] border-none rounded-xl focus:ring-2 focus:ring-primary" placeholder="••••••••" type="password" required>
          </div>
        </div>

        <div class="space-y-2">
          <label class="text-sm font-semibold">Потвърдете паролата</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-[#616f89] text-[20px]">lock</span>
            <input th:field="*{confirmPassword}" class="w-full pl-11 pr-4 py-3 bg-[#f0f2f4] border-none rounded-xl focus:ring-2 focus:ring-primary" placeholder="••••••••" type="password" required>
          </div>
        </div>

        <button class="w-full py-4 bg-primary text-white rounded-xl font-bold text-lg hover:bg-blue-700 transition-all shadow-lg shadow-primary/30 mt-4" type="submit">
          Регистрация
        </button>
      </form>

      <div class="mt-8 pt-6 border-t border-[#dbdfe6] text-center">
        <p class="text-[#616f89] text-sm">
          Вече имате акаунт?
          <a class="text-primary font-bold hover:underline ml-1" href="/login">Влезте тук</a>
        </p>
      </div>
    </div>
  </div>
</div>

</body>
</html>
